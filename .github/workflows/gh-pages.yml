# 构建检查：网站由 Cloudflare Pages 直接从 main 构建并发布，本工作流只确认 pnpm run build 能通过。
# 以前这里还把 dist 推到 gh-pages 分支，但仓库没有启用 GitHub Pages，那一步没有用处，
# 还会在连续推送时互相冲突而失败，并让 Cloudflare 每次去构建 gh-pages 分支（必然失败）。
name: Build check

on:
  push:
    branches:
      # The branch where the project source code resides
      # 项目源代码所在的分支
      - main
      - master
      - valaxy

permissions:
  contents: read

# 同一分支连续推送时，只检查最新一次
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        node-version: [lts/*]
        os: [ubuntu-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🌌 Build Valaxy Blog
        run: pnpm run build
